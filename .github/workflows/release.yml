name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Installers
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build web assets and electron bundles
        run: npm run build

      - name: Disable Spotlight indexing
        run: sudo mdutil -a -i off || true

      - name: Package macOS application
        run: npx electron-builder --mac --publish never

      - name: Upload macOS installers
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build web assets and electron bundles
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: release/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish Clean GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release notes
        run: |
          NOTES=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          if [ -n "$NOTES" ]; then
            printf "%s\n\n" "$NOTES" > release_notes.md
          fi
          {
            echo "### Installation"
            echo ""
            echo "| Platform | Architecture | File |"
            echo "|---|---|---|"
            echo '| macOS | Apple Silicon | `*-macOS-AppleSilicon.dmg` |'
            echo '| macOS | Intel | `*-macOS-Intel.zip` |'
            echo '| Windows | 64-bit | `*-Windows-x64.exe` |'
          } >> release_notes.md

      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.zip
            dist-artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
