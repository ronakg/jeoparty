# ==============================================================================
# MINIMAL TEST GAME (MANUAL & AUTOMATED TESTING REFERENCE)
# ==============================================================================
# Purpose:
# This minimal 3x3 game board is used for manual and automated verification of
# the host panel and player display. It exercises all game mechanics and media
# formats while staying as minimal as possible.
#
# Requirements & Invariants:
# 1. Layout: Exactly 3 categories with 3 questions each, plus one tie-breaker.
# 2. Coverage: Every distinct clue/media use-case must be exercised:
#    - Native image media (SVG)
#    - Native audio media (WAV)
#    - Standard YouTube video embed (audio & video playback)
#    - YouTube audio-only embed (audioOnly: true, audio player layout)
#    - Video formats: AVI, WebM, MOV, and MP4
#    - Text-only clues without media (testing non-media layout and mechanics)
#    - Hints on all clues
#    - Tie-breaker clue
#
# Guidance for Future Edits:
# When repurposing or adding tests for new features, NEVER remove or eliminate
# an existing media use-case. Repurpose redundant non-media questions instead,
# ensuring at least one text-only question always remains.
# ==============================================================================

title: Minimal Test Game
team1: Team Alpha
team2: Team Omega
pointProgression:
  - 100
  - 200
  - 300
hintPenalty: 50
reboundPercentage: 50
questionTimerSeconds: 15
categories:
  - name: SIGHT & SOUND
    questions:
      - title: What geometric shape is rendered inside this graphic?
        answer: Circle
        hint: It has no corners or edges.
        media:
          type: image
          url: "media/test_image.svg"
      - title: Listen to this audio tone and identify the musical pitch.
        answer: 440 Hz Concert Pitch A
        hint: Standard orchestral tuning reference.
        media:
          type: audio
          url: "media/test_audio.wav"
      - title: Identify the music video in this YouTube embed.
        answer: Never Gonna Give You Up
        hint: 1987 dance-pop hit.
        media:
          type: youtube
          url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
  - name: AVI & WEBM
    questions:
      - title: Watch this AVI video clip and identify what is shown.
        answer: Video clip
        hint: A sample AVI video clip.
        media:
          type: video
          url: "media/file_example_AVI_1280_1_5MG.avi"
      - title: Watch this WebM video clip and identify what is shown.
        answer: Video clip
        hint: A sample WebM video clip.
        media:
          type: video
          url: "media/file_example_WEBM_640_1_4MB.webm"
      - title: Listen to this YouTube audio track and identify the song.
        answer: Never Gonna Give You Up
        hint: 1987 dance-pop hit.
        media:
          type: youtube
          url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          audioOnly: true
  - name: MOV & MP4
    questions:
      - title: Watch this QuickTime MOV clip and identify what is shown.
        answer: Video clip
        hint: A sample QuickTime MOV video clip.
        media:
          type: video
          url: "media/file_example_MOV_1280_1_4MB.mov"
      - title: Watch this MP4 video clip and identify what is shown.
        answer: Video clip
        hint: A sample MP4 video clip.
        media:
          type: video
          url: "media/file_example_MP4_640_3MG.mp4"
      - title: What is the capital city of France?
        answer: Paris
        hint: The City of Light.
tieBreaker:
  category: SIGHT & SOUND
  title: What unit of frequency measures sound waves in cycles per second?
  answer: Hertz (Hz)
  hint: Named after German physicist Heinrich Hertz.
