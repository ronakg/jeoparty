title: Ultimate Trivia Challenge
team1: Team Alpha
team2: Team Omega
pointProgression:
  - 100
  - 200
  - 300
  - 400
  - 500
hintPenalty: 100
reboundPercentage: 50
categories:
  - name: WORLD LANDMARKS
    questions:
      - title: Identify this iconic 330-meter iron lattice tower located in Paris along the Seine River.
        answer: Eiffel Tower
        hint: Completed in 1889 for the Exposition Universelle.
        media:
          type: image
          url: data:image/svg+xml;base64,
      - title: Name this massive ancient amphitheater in Rome, used for gladiatorial contests.
        answer: The Colosseum
        hint: Constructed under Emperor Vespasian and completed by Titus.
        media:
          type: image
          url: data:image/svg+xml;base64,
      - title: This high-altitude freshwater lake straddles the border between Bolivia and Peru.
        answer: Lake Titicaca
        hint: Highest navigable body of water in the world.
      - title: "Watch this clip: What famous prehistoric monument in Wiltshire, England consists of standing stones?"
        answer: Stonehenge
        hint: Built in several stages from roughly 3000 BC to 2000 BC.
        media:
          type: youtube
          url: https://www.youtube.com/watch?v=48yO0U9k89A
      - title: What narrow waterway separates the southern tip of Spain from northern Morocco?
        answer: Strait of Gibraltar
        hint: Connects the Atlantic Ocean to the Mediterranean Sea.
  - name: MUSIC & SOUNDS
    questions:
      - title: "Listen to this famous 4-note motif: Which classical German composer wrote this 5th symphony?"
        answer: Ludwig van Beethoven
        hint: Premiered in Vienna in 1808.
        media:
          type: audio
          url: data:audio/wav;base64,
      - title: Which British rock quartet recorded their famous final studio album 'Abbey Road' in 1969?
        answer: The Beatles
        hint: Features John, Paul, George, and Ringo on the zebra crossing cover.
      - title: "Watch this official music video clip: Name this multi-part 1975 rock masterpiece by Queen."
        answer: Bohemian Rhapsody
        hint: Written by Freddie Mercury for 'A Night at the Opera'.
        media:
          type: youtube
          url: https://www.youtube.com/watch?v=fJ9rUzIMcZQ
      - title: "Listen to this fanfare melody: To what brass instrument family does this lead horn belong?"
        answer: Trumpet
        hint: Uses three piston valves to change pitch.
        media:
          type: audio
          url: data:audio/wav;base64,
      - title: In musical notation, what Italian dynamic term instructs performers to play softly?
        answer: Piano (p)
        hint: Pianissimo (pp) means very soft.
  - name: CINEMA & ENTERTAINMENT
    questions:
      - title: Identify this charismatic Bollywood superstar and actor shown here in his signature sunglasses.
        answer: Shah Rukh Khan (SRK)
        hint: Widely hailed as 'King Khan' or the 'Baadshah of Bollywood'.
        media:
          type: image
          url: data:image/jpeg;base64,
      - title: "Watch this video test clip: What is the standard video container format being demonstrated here?"
        answer: MP4 (MPEG-4 Part 14)
        hint: Widely supported across HTML5 browsers and mobile devices.
        media:
          type: video
          url: data:video/mp4;base64,
      - title: "Watch this classic film excerpt: What 1985 sci-fi adventure features a DeLorean time machine?"
        answer: Back to the Future
        hint: Directed by Robert Zemeckis, starring Michael J. Fox.
        media:
          type: youtube
          url: https://www.youtube.com/watch?v=Psxktpxkc6o
      - title: Name this Bollywood leading lady who debuted in 'Om Shanti Om' and starred in 'Padmaavat'.
        answer: Deepika Padukone
        hint: Married to Ranveer Singh and recipient of multiple Filmfare awards.
        media:
          type: image
          url: data:image/jpeg;base64,
      - title: What fictional high-tech African kingdom is protected and ruled by Black Panther in Marvel Comics?
        answer: Wakanda
        hint: Rich in the rare fictional metal vibranium.
  - name: SCIENCE & NATURE
    questions:
      - title: What chemical element accounts for approximately 78% of Earth's atmosphere by volume?
        answer: Nitrogen (N2)
        hint: Its atomic number is 7.
      - title: Identify this ringed gas giant planet, the sixth from the Sun in our Solar System.
        answer: Saturn
        hint: Its largest moon is Titan, which possesses a dense atmosphere.
        media:
          type: image
          url: data:image/svg+xml;base64,
      - title: Which membrane-bound organelle is famously termed the powerhouse of the eukaryotic cell?
        answer: Mitochondria
        hint: Generates chemical energy in the form of ATP.
      - title: Identify this acclaimed actor recognized for roles in Haider, Jab We Met, and Kabir Singh.
        answer: Shahid Kapoor
        hint: Son of veteran actor Pankaj Kapur.
        media:
          type: image
          url: data:image/jpeg;base64,
      - title: Discovered by Alexander Fleming in 1928, what was the first mass-produced antibiotic?
        answer: Penicillin
        hint: Derived from the Penicillium mold genus.
  - name: FOOD & DRINK
    questions:
      - title: Traditional Japanese wasabi paste is grated from the rhizome of a plant related to what condiment?
        answer: Horseradish (or Mustard)
        hint: Belongs to the Brassicaceae botanical family.
      - title: Identify this classic Italian coffee-flavored layered dessert dusted with cocoa powder.
        answer: Tiramisu
        hint: Literally translates from Italian to 'pick me up'.
        media:
          type: image
          url: data:image/svg+xml;base64,
      - title: Which precious golden spice is harvested by hand from the stigmas of the purple crocus flower?
        answer: Saffron
        hint: Widely regarded as the most expensive spice by weight in the world.
      - title: Which country is the birthplace of the cocktail 'Caipirinha', made with fermented sugarcane cachaça?
        answer: Brazil
        hint: South America’s largest Portuguese-speaking nation.
      - title: Identify this leading actress who portrayed the warrior Avanthika in Baahubali.
        answer: Tamannaah Bhatia
        hint: Star of viral chartbusters 'Kaavaalaa' and 'Aaj Ki Raat'.
        media:
          type: image
          url: data:image/jpeg;base64,
tieBreaker:
  category: THE COSMOS
  title: What is the closest major spiral galaxy to our own Milky Way, situated 2.5 million light-years away?
  answer: Andromeda Galaxy (M31)
  hint: Expected to collide and merge with the Milky Way in approximately 4.5 billion years.
  media:
    type: image
    url: data:image/svg+xml;base64,
